<title>Glow City Autohaus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=Inter:wght@400;600;700&display=swap">
<style>
/* Showroom-Raster: fünf Stufen, gleiche Karten, gleicher Maßstab. Feste Abendstimmung wie in der Stadt. */
:root{--bg:#1c2230;--card:rgba(255,255,255,.05);--line:rgba(216,195,154,.22);--ink:#f5f1ea;--muted:#a9a6a0;--gold:#d8c39a;
--display:"Bodoni Moda",Didot,Georgia,serif;--body:"Inter",system-ui,sans-serif;color-scheme:dark}
body{background:radial-gradient(120% 80% at 50% 0%,#3a4c6b 0%,#1c2230 60%);background-color:var(--bg);color:var(--ink);font-family:var(--body);min-height:100%}
.wrap{max-width:1500px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:22px}
h1{font:500 clamp(28px,4vw,44px)/1 var(--display);margin:0}
header p{margin:0;color:var(--muted);font-size:14px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.car{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.stage{position:relative;aspect-ratio:16/11;background:radial-gradient(90% 70% at 50% 62%,#4a5468 0%,#262d3b 70%)}
.stage img{width:100%;height:100%;display:block;object-fit:contain;transform:scale(1.18)}
.stage.fly img{animation:schweben 3.6s ease-in-out infinite}
@keyframes schweben{50%{transform:scale(1.18) translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.stage.fly img{animation:none}}
.lvl{position:absolute;top:10px;left:10px;font:700 10px var(--body);letter-spacing:.16em;text-transform:uppercase;color:#15161a;background:var(--gold);padding:5px 8px;border-radius:6px}
.paint{position:absolute;top:10px;right:10px}
.paint i{display:block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{margin:0;font:500 21px var(--display)}
.body .kind{color:var(--muted);font-size:12px;margin-top:-4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px}
.stats div{background:rgba(255,255,255,.05);border-radius:9px;padding:6px 9px}
.stats span{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats b{font:500 16px var(--display);font-variant-numeric:tabular-nums}
.stats .stil b{color:var(--gold)}
.extra{font-size:12.5px;line-height:1.45;color:#d9d4cb;margin:0}
.unlock{margin-top:auto;font-size:11px;letter-spacing:.06em;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
</style>
<div class="wrap">
  <header><h1>Autohaus</h1><p>Fünf Stufen. Jedes Auto bringt jeden Tag Stilpunkte und fährt danach sichtbar durch die Stadt, auch in den Reels.</p></header>
  <div class="grid" id="grid"></div>
</div>
<script>
// Geometrie in Metern. p = Dachlinie von hinten (x=0) nach vorn (x=L), 'g' markiert Front- und Heckscheibe.
// belt = Fensterunterkante, roof = Dachbreite im Verhältnis, box = kantiger Querschnitt, pil = B-Säule
const CARS=[
 {lvl:1,name:'Renaux Twinga',kind:'Kleinwagen',paint:'Rosso',price:'38.000 €',stil:'+2',fol:'±0',extra:'Passt in jede Lücke vor Starbux. Charmant, aber noch dreht sich niemand um.',unlock:'Ab 10 Arbeitstagen · aktiv gespart etwa 4 Wochen',
  col:[190,30,38],rim:[220,224,228],L:3.6,W:1.66,wr:.3,wh:[.62,2.95],belt:1,roof:.8,pil:[1.55,1.67],lights:'round',
  p:[[0,.35],[0,.95],[.06,1.25,'g'],[.28,1.48],[1.9,1.5],[2.6,1.05,'g'],[3.35,.92],[3.6,.7],[3.6,.35]]},
 {lvl:2,name:'Audri S5',kind:'Sportback, 367 PS',paint:'Daytonagrau',price:'240.000 €',stil:'+9',fol:'+1 %',extra:'Fahrer auf Wunsch. Der Tisch im Borchert wird leichter frei.',unlock:'Ab 60 Arbeitstagen · etwa 4 Monate',
  col:[92,96,102],rim:[190,194,199],L:4.75,W:1.85,wr:.35,wh:[1.02,3.85],belt:.98,roof:.7,pil:[2.1,2.2],lights:'strip',grille:1,
  p:[[0,.4],[0,.92],[.25,1],[1.0,1.3,'g'],[2.4,1.36],[3.15,1,'g'],[4.55,.82],[4.75,.6],[4.75,.4]]},
 {lvl:3,name:'Mercedia G 63',kind:'Luxus-Geländewagen',paint:'Magno Schwarz',price:'650.000 €',stil:'+22',fol:'+4 %',extra:'Parkt vor Prado in zweiter Reihe. Jedes Foto damit bringt doppelte Follower.',unlock:'Ab 180 Arbeitstagen · etwa 8 Monate',
  col:[34,35,38],rim:[30,31,34],matte:1,L:4.85,W:1.98,wr:.42,wh:[.98,3.85],belt:1.5,roof:.96,box:1,pil:[1.9,2.02],lights:'round',grille:1,
  p:[[0,.45],[0,1.94],[.06,2],[3.6,2],[3.72,1.52,'g'],[4.75,1.46],[4.85,1.36],[4.85,.45]]},
 {lvl:4,name:'Lamborgia Furioso',kind:'Supersportwagen, 830 PS',paint:'Rosa Miami',price:'1,6 Mio. €',stil:'+45',fol:'+10 %',extra:'Türen öffnen nach oben, die ganze Promenade schaut.',unlock:'Ab 365 Arbeitstagen · etwa 15 Monate',
  col:[236,150,190],rim:[28,28,30],L:4.7,W:2.05,wr:.36,wh:[1.08,3.85],belt:.95,roof:.5,pil:[9,9],lights:'strip',
  p:[[0,.36],[0,.86],[.55,.98],[1.6,1.12],[2.25,1.14],[3.35,.78,'g'],[4.55,.47],[4.7,.36]]},
 {lvl:5,name:'Teslo Roadster',kind:'Fliegender Roadster, elektrisch',paint:'Chrom',price:'4,8 Mio. €',stil:'+120',fol:'+25 %',extra:'Hebt ab, fliegt über den Stau und landet auf dem Dach vom Glow Hotel. Eigene Szene in jeder Wochenfolge.',unlock:'Ab 730 Arbeitstagen · etwa 2,7 Jahre',
  fly:1,chrome:1,col:[210,214,220],rim:[60,64,70],L:4.65,W:2,wr:.36,wh:[1.02,3.8],belt:.9,roof:.56,glassRoof:1,pil:[9,9],lights:'strip',
  p:[[0,.38],[0,.76],[.35,.88],[1.3,1.13],[2.1,1.22,'g'],[3.0,1.02,'g'],[3.9,.73],[4.5,.6],[4.65,.46],[4.65,.38]]}];
const grid=document.getElementById('grid');
CARS.forEach(c=>{const el=document.createElement('article');el.className='car';
  el.innerHTML=`<div class="stage${c.fly?' fly':''}"><img alt="" src="autos/stufe${c.lvl}.png"><span class="lvl">Stufe ${c.lvl}</span><span class="paint"><i style="background:rgb(${c.col})"></i></span></div>
  <div class="body"><h2></h2><div class="kind"></div>
  <div class="stats"><div><span>Preis</span><b>${c.price}</b></div><div class="stil"><span>Stil pro Tag</span><b>${c.stil}</b></div><div><span>Follower</span><b>${c.fol}</b></div><div><span>Stufe</span><b>${c.lvl} von 5</b></div></div>
  <p class="extra"></p><div class="unlock"></div></div>`;
  el.querySelector('h2').textContent=c.name;el.querySelector('.kind').textContent=c.kind+' · '+c.paint;el.querySelector('.extra').textContent=c.extra;el.querySelector('.unlock').textContent=c.unlock;
  el.querySelector('img').alt=c.name;grid.append(el)});

</script>
