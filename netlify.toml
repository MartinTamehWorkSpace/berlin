# Berlin auf Netlify (berlin-city.netlify.app, eigener Server und Speicher, getrennt von Glow City): statische Seite aus dem Ordner, den werkzeug/netlify_paket.sh baut, dazu die Server-Funktion für Konten und Chat
[build]
  publish = "FINAL/netlify"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"

# Kurze Einladungslinks: berlin-city.netlify.app/m/martin führt ins Spiel mit Einladung von martin
[[redirects]]
  from = "/m/:name"
  to = "/?ref=:name"
  status = 302

# Berlin: Das Spiel kommt von GitHub Pages (kostenlos bei jedem git push), Netlify reicht es nur durch.
# Ohne force: /api (Serverfunktion), admin.html und vorschau.jpg bleiben auf Netlify, alles andere kommt von GitHub.
[[redirects]]
  from = "/*"
  to = "https://martintamehworkspace.github.io/berlin/:splat"
  status = 200
